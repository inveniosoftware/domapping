[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "domapping"
dynamic = ["version"]
description = "DoMapping generates Elasticsearch mappings from JSON Schemas."
readme = "README.rst"
license = "MIT"
authors = [
    { name = "CERN", email = "info@inveniosoftware.org" },
]
keywords = [
    "elasticsearch",
    "jsonschema",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
]
dependencies = [
    "click>=5.1",
    "jinja2>=2.7",
    "jsonschema>=2.5.0",
    "pytest-isort>=4.0.0",
]
requires-python = ">= 3.8"

[project.optional-dependencies]
docs = [
    "sphinx>=1.4.2",
]
tests = [
    "check-manifest>=0.25",
    "coverage>=4.0",
    "isort>=4.2.2",
    "pydocstyle>=1.0.0",
    "pytest-black>=0.6.0",
    "pytest-cache>=1.0",
    "pytest-cov>=1.8.0",
    "pytest-isort>=4.0.0",
    "pytest>=2.8.0,<9",
    "responses>=0.5.1",
]

[project.scripts]
domapping = "domapping.cli:cli"

[project.urls]
Homepage = "https://github.com/inveniosoftware/domapping"

[tool.hatch.version]
path = "domapping/version.py"

[tool.hatch.build.targets.sdist]
include = [
    "/domapping",
]
[tool.isort]
profile = "black"

[tool.pydocstyle]
add_ignore = "D401"

[tool.pytest.ini_options]
addopts = '--black --isort --ignore=docs --cov=domapping --cov-report=term-missing'
testpaths = "tests domapping"
